<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin — DEEPIZZA</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" data-site-nav></nav>
    </header>
    <main>
      <section id="admin-dashboard">
        <div class="admin-header reveal">
          <div>
            <h1 style="margin: 0; color: var(--purple-deep); font-size: 1.5rem">Order dashboard</h1>
            <p class="line-meta">Incoming, pending delivery, and completed orders — updates every 8s.</p>
          </div>
          <button type="button" class="btn btn-secondary" id="refresh-orders">Refresh</button>
        </div>

        <div class="admin-stats reveal">
          <button type="button" class="stat-card active" data-admin-tab="all">
            <span class="stat-num" data-stat="all">0</span>
            <span class="stat-label">All orders</span>
          </button>
          <button type="button" class="stat-card" data-admin-tab="incoming">
            <span class="stat-num" data-stat="incoming">0</span>
            <span class="stat-label">Incoming</span>
          </button>
          <button type="button" class="stat-card" data-admin-tab="pending">
            <span class="stat-num" data-stat="pending">0</span>
            <span class="stat-label">Pending</span>
          </button>
          <button type="button" class="stat-card" data-admin-tab="completed">
            <span class="stat-num" data-stat="completed">0</span>
            <span class="stat-label">Completed</span>
          </button>
        </div>

        <p id="orders-empty" class="empty-cart reveal" hidden>No orders yet — place one from the Order page.</p>

        <div class="orders-table-wrap reveal">
          <table class="orders-table">
            <thead>
              <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Payment</th>
                <th>Total</th>
                <th>Status</th>
                <th>Update</th>
              </tr>
            </thead>
            <tbody id="orders-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="js/menu-data.js"></script>
    <script src="js/site-content.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/scroll-reveal.js"></script>
    <script src="js/admin.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", initScrollReveal);
    </script>
  </body>
</html>
