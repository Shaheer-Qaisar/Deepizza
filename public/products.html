<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products — DEEPIZZA</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" data-site-nav></nav>
    </header>
    <main>
      <div class="section-title reveal">
        <h2>All products</h2>
        <p>Pizza, burgers, drinks &amp; sides — add to cart and checkout online.</p>
      </div>

      <div id="category-filters" class="filter-bar reveal"></div>

      <section id="deals" class="home-section reveal">
        <h3 class="subsection-title">Instagram deals &amp; new drops</h3>
        <div id="deals-strip" class="deals-strip-grid"></div>
      </section>

      <div id="products-grid" class="products-grid"></div>

      <section class="home-section reveal">
        <div class="section-title">
          <h2>Customer reviews</h2>
          <p>Real feedback style posts — see more on social.</p>
        </div>
        <div id="product-reviews"></div>
      </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <script src="js/menu-data.js"></script>
    <script src="js/site-content.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/scroll-reveal.js"></script>
    <script src="js/products-page.js"></script>
  </body>
</html>
